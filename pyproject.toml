[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazycommit"
version = "0.4.1"
description = "Local-first agent that proposes logical Conventional Commits from messy Git changes (preview by default; commits only after explicit approval)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sentry = ["sentry-sdk>=2.0,<3"]
dev = ["pytest>=8", "mypy>=1.10", "sentry-sdk>=2.0,<3"]

[project.scripts]
lazycommit = "lazycommit.cli:main"
lazycommit-bench = "lazycommit.benchmark.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: integration test against a real local Ollama model (set LAZYCOMMIT_TEST_MODEL to enable)",
    "benchmark: runs the real-model benchmark (set LAZYCOMMIT_TEST_MODEL to enable)",
    "github: pushes and opens real PRs in a throwaway GitHub repo (set LAZYCOMMIT_GITHUB_SANDBOX to enable)",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
